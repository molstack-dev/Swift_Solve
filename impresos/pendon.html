<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pendón — SwiftSolve</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <style>
        /* ============================================================
           SAFETY OVERRIDES
           ============================================================ */
        html, body {
            background: #1a1a1a;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: visible;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        a { color: inherit; text-decoration: none; font-style: normal; }
        a:hover { font-style: normal; }

        :root {
            --green: #00d084;
            --green-bright: #4dffb8;
            --green-deep: #00a86b;
            --dark-deep: #0a0f0c;
            --dark-mid: #101311;
            --glow: #00a86b;
            --bg: #0a0f0c;
            --text: #f4f7f5;
            --muted: #a5b0a9;
            --line: rgba(0,208,132,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        @page { size: 60cm 160cm; margin: 0; }

        /* ============================================================
           PENDÓN
           ============================================================ */
        .pendon {
            width: 60cm;
            height: 160cm;
            background:
                radial-gradient(ellipse at top, rgba(0,208,132,0.35) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(0,168,107,0.4) 0%, transparent 55%),
                linear-gradient(180deg, #0a0f0c 0%, #101311 45%, #0a0f0c 100%);
            color: var(--text);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 5cm 5cm 4cm;
            box-shadow: 0 30px 80px rgba(0,168,107,0.7);
        }

        .pendon::before {
            content: '';
            position: absolute;
            inset: 2cm;
            border: 1.5px solid var(--line);
            pointer-events: none;
        }

        .pendon::after {
            content: '';
            position: absolute;
            inset: 2.4cm;
            border: 1px solid rgba(0,208,132,0.15);
            pointer-events: none;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .pendon-header {
            text-align: center;
            position: relative;
            z-index: 1;
            margin-bottom: 2.5cm;
        }

        .pendon-eyebrow {
            display: inline-block;
            font-family: 'Manrope', sans-serif;
            font-size: 1.7cm;
            letter-spacing: 0.9cm;
            color: var(--green);
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.4cm 1.5cm 0.4cm 2.4cm;
            border-top: 1.5px solid var(--line);
            border-bottom: 1.5px solid var(--line);
            margin-bottom: 4cm;
        }

        .pendon-nombre {
            font-family: 'Manrope', sans-serif;
            font-size: 9cm;
            color: var(--green-bright);
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 0.95;
            text-shadow: 0 0 2.5cm rgba(77,255,184,0.55),
                         0 0.25cm 1.2cm rgba(0,168,107,0.4);
            margin-bottom: 1cm;
        }

        .pendon-nombre .brand-dot { color: var(--green); }

        .pendon-linea {
            width: 20cm;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            margin: 4cm auto;
            margin-top: 5cm;
        }

        .pendon-subtitulo {
            font-family: 'Manrope', sans-serif;
            font-size: 2.5cm;
            color: var(--text);
            letter-spacing: 1.4cm;
            text-transform: uppercase;
            font-weight: 500;
            padding-left: 1.4cm;
        }

        /* ============================================================
           LOGO
           ============================================================ */
        .pendon-logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 3.5cm;
            margin-top: 3.5cm;
            position: relative;
            z-index: 1;
        }

        .pendon-logo {
            width: 45cm;
            height: 45cm;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            transform: scale(0.9);
            transform-origin: center;
            border: 19px solid var(--green);
            padding: 1mm;
            background: rgba(10,15,12,0.9);
            overflow: hidden;
            box-shadow: 0 0 5cm rgba(0,208,132,0.7),
                        0 0 2cm rgba(0,168,107,0.35);
        }

        /* ============================================================
           ESLOGAN (reemplaza los servicios)
           ============================================================ */
        .pendon-eslogan {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 0cm;
        }

        .eslogan-texto {
            font-family: 'Manrope', sans-serif;
            font-size: 5cm;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: var(--text);
            margin-bottom: 1.5cm;
        }

        .eslogan-texto .linea-1 {
            display: block;
            color: var(--text);
        }

        .eslogan-texto .linea-2 {
            display: relative;
            font-family: 'Parisienne', cursive;   /* ← fuente aplicada */
            font-weight: 400;                     /* ← Parisienne solo tiene weight 400 */
            font-size: 6.5cm;                     /* ← un poco más grande para compensar */
            letter-spacing: 0.05cm;               /* ← ligero ajuste (opcional) */
            color: var(--green-bright);
            text-shadow: 0 0 2.5cm rgba(77,255,184,0.55),
                         0 0.3cm 1.2cm rgba(0,168,107,0.4);
        }

        .eslogan-linea-deco {
            width: 20cm;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            margin: 2.5cm auto 2cm;
        }

        .eslogan-sub {
            font-family: 'Manrope', sans-serif;
            font-size: 2cm;
            font-weight: 500;
            letter-spacing: 0.6cm;
            text-transform: uppercase;
            color: var(--muted);
            padding-left: 0.6cm;
        }

        /* ============================================================
           CONTACTO
           ============================================================ */
        .pendon-contacto {
            position: relative;
            z-index: 1;
            margin-top: 2cm;
            padding-top: 3cm;
            border-top: 1.5px solid var(--line);
            text-align: center;
        }

        .contacto-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 2.5cm;
            align-items: center;
            margin-top: 2mm;
        }

        .qr-grande {
            background: #fff;
            padding: 0.4cm;
            border-radius: 0.5cm;
            width: 19cm;
            height: 19cm;
            border: 10px solid var(--green);
            box-shadow: 0 0 20cm rgba(0,208,132,0.7);
        }

        .qr-grande img { width: 100%; height: 100%; display: block; }

        .contacto-datos {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 3cm;
        }

        .contacto-item {
            display: flex;
            align-items: center;
            gap: 1cm;
            color: var(--text);
        }

        .contacto-item svg {
            width: 2.2cm;
            height: 2.2cm;
            flex-shrink: 0;
            color: var(--green-bright);
        }

        .contacto-item .valor {
            font-size: 1.3cm;
            font-weight: 400;
            color: var(--text);
            line-height: 1;
            padding: 20px 0;
        }

        .pendon-web {
            font-family: 'Manrope', sans-serif;
            font-size: 3cm;
            font-weight: 800;
            color: var(--green-bright);
            letter-spacing: 0.4cm;
            margin: 20px auto;
            margin-top: 60px;
            text-align: center;
            text-shadow: 0 0 1.5cm rgba(0,208,132,0.7);
        }

        /* ============================================================
           PRINT
           ============================================================ */
        @media print {
            html, body {
                background: #fff;
                padding: 0;
                min-height: auto;
                display: block;
            }
            .pendon { box-shadow: none; }
        }
    </style>
</head>
<body>
