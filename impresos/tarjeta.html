<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta — SwiftSolve</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <style>
        /* ============================================================
           SAFETY OVERRIDES
           ============================================================ */
        html, body {
            background: #1a1a1a;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 100vh;
            overflow-x: visible;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        a { color: inherit; text-decoration: none; font-style: normal; }
        a:hover { font-style: normal; }

        :root {
            --green: #00d084;
            --green-bright: #4dffb8;
            --green-deep: #00a86b;
            --dark-deep: #0a0f0c;
            --dark-mid: #101311;
            --glow: #00a86b;
            --bg: #0a0f0c;
            --text: #f4f7f5;
            --muted: #a5b0a9;
            --line: rgba(0,208,132,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        @page { size: 85mm 55mm; margin: 0; }

        /* ============================================================
           TARJETA
           ============================================================ */
        .tarjeta {
            width: 85mm;
            height: 55mm;
            border-radius: 2mm;
            position: relative;
            overflow: hidden;
            color: var(--text);
            box-shadow: 0 15px 40px rgba(0,168,107,0.6);
        }

        .tarjeta + .tarjeta { page-break-before: always; }

        /* ============================================================
           CARA FRONTAL
           ============================================================ */
        .tarjeta-frontal {
            background:
                radial-gradient(ellipse at top right, rgba(0,208,132,0.45) 0%, transparent 55%),
                radial-gradient(ellipse at bottom left, rgba(0,168,107,0.4) 0%, transparent 55%),
                linear-gradient(135deg, #0a0f0c 0%, #101311 50%, #0a0f0c 100%);
            display: flex;
            flex-direction: column;
            padding: 5mm;
            justify-content: space-between;
        }

        .tarjeta-frontal::before {
            content: '';
            position: absolute;
            inset: 2mm;
            border: 0.5px solid var(--line);
            border-radius: 1.5mm;
            pointer-events: none;
        }

        /* ============================================================
           LOGO EN LA CARA FRONTAL — esquina superior derecha
           ============================================================ */
        .tarjeta-logo {
            width: 22mm;
            height: 22mm;
            border-radius: 50%;
            object-fit: contain;
            object-position: center;
            transform: scale(1);
            transform-origin: center;
            border: 2px solid var(--green);
            padding: 1mm;
            background: rgba(10,15,12,0.85);
            overflow: hidden;
            position: absolute;
            top: 13mm;
            right: 5mm;
            z-index: 2;
            box-shadow: 0 0 12px rgba(77,255,184,0.5),
                        0 0 6px rgba(0,208,132,0.6);
        }

        /* ============================================================
           LOGO / MARCA SUPERIOR
           ============================================================ */
        .tarjeta-marca {
            display: flex;
            align-items: center;
            gap: 1.8mm;
            position: relative;
            z-index: 1;
        }

        .tarjeta-marca svg {
            width: 4.5mm;
            height: 4.5mm;
            color: var(--green-bright);
            filter: drop-shadow(0 0 4px rgba(77,255,184,0.6));
        }

        .tarjeta-marca-texto {
            font-family: 'Manrope', sans-serif;
            font-size: 5.5pt;
            color: var(--green);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ============================================================
           NOMBRE
           ============================================================ */
        .tarjeta-nombre {
            font-family: 'Manrope', sans-serif;
            font-size: 20pt;
            color: var(--green-bright);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-shadow: 0 0 12px rgba(77,255,184,0.55),
                         0 1.5px 6px rgba(0,168,107,0.4);
            position: relative;
            z-index: 1;
        }

        .tarjeta-nombre .brand-dot { color: var(--green); }

        .tarjeta-nombre-linea {
            width: 18mm;
            height: 0.5px;
            background: linear-gradient(90deg, var(--green), transparent);
            margin: 1.5mm 0;
            position: relative;
            z-index: 1;
        }

        .tarjeta-rol {
            font-family: 'Manrope', sans-serif;
            font-size: 6pt;
            color: var(--text);
            letter-spacing: 1.6px;
            text-transform: uppercase;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           FOOTER FRONTAL
           ============================================================ */
        .tarjeta-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .tarjeta-logros-mini { display: flex; gap: 1mm; }

        .tarjeta-logros-mini svg {
            width: 2.8mm;
            height: 2.8mm;
            color: var(--green);
            filter: drop-shadow(0 0 3px rgba(77,255,184,0.6));
        }

        .tarjeta-web {
            font-size: 5pt;
            color: var(--green-bright);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0,208,132,0.8);
        }

        /* ============================================================
           CARA TRASERA
           ============================================================ */
        .tarjeta-trasera {
            background:
                radial-gradient(ellipse at top left, rgba(0,208,132,0.25) 0%, transparent 55%),
                linear-gradient(135deg, #0a0f0c 0%, #101311 100%);
            padding: 5mm;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 3.5mm;
            align-items: center;
            position: relative;
        }

        .tarjeta-trasera::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1mm;
            height: auto;
            background: linear-gradient(180deg, var(--glow), var(--green-bright), var(--glow));
        }

        .tarjeta-trasera-info {
            display: flex;
            flex-direction: column;
            gap: 1.8mm;
            position: relative;
            z-index: 1;
        }

        .tarjeta-trasera-titulo {
            font-family: 'Manrope', sans-serif;
            font-size: 7.5pt;
            color: var(--green-bright);
            font-weight: 800;
            letter-spacing: 0.3px;
            margin-bottom: 0.8mm;
            text-shadow: 0 0 8px rgba(0,208,132,0.7);
        }

        .tarjeta-trasera-titulo::after {
            content: '';
            display: block;
            width: 7mm;
            height: 0.7px;
            background: var(--green);
            margin-top: 0.8mm;
        }

        .tarjeta-dato {
            display: flex;
            align-items: center;
            gap: 1.6mm;
            font-size: 5.8pt;
            color: var(--text);
            line-height: 1.3;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .tarjeta-dato svg {
            width: 2.6mm;
            height: 2.6mm;
            flex-shrink: 0;
            color: var(--green-bright);
        }

        /* ============================================================
           QR TRASERO
           ============================================================ */
        .tarjeta-qr {
            width: 24mm;
            height: 24mm;
            background: #fff;
            padding: 0.6mm;
            border-radius: 1mm;
            border: 1px solid var(--green);
            transform: scale(1);
            box-shadow: 0 0 10px rgba(0,208,132,0.6);
            position: relative;
            z-index: 1;
        }

        .tarjeta-qr img { width: 100%; height: 100%; display: block; }

        .tarjeta-qr-label {
            position: absolute;
            bottom: -3.5mm;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4.5pt;
            color: var(--muted);
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           PRINT
           ============================================================ */
        @media print {
            html, body {
                background: #fff;
                padding: 0;
                gap: 0;
                min-height: auto;
                display: block;
            }
            .tarjeta {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
